<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHUSPELL Air Therapy Pouch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  /* SPA 환경에서 다른 컴포넌트에 영향을 주지 않도록 최상위 클래스로 스코핑합니다 */
  .shuspell-detail-wrapper {
    font-family: 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
    background: linear-gradient(135deg, #e0e0e0 0%, #a8a8a8 100%); /* 나뭇잎 그림자가 드리운 듯한 차분한 그레이톤 */
    color: #333;
    max-width: 600px;
    margin: 0 auto;
    padding: 30px 20px;
    box-sizing: border-box;
    position: relative;
    overflow: hidden;
  }

  /* 행간 및 여백 최소화 */
  .shuspell-detail-wrapper p, 
  .shuspell-detail-wrapper h1, 
  .shuspell-detail-wrapper h2 {
    margin: 0;
    padding: 0;
    line-height: 1.3;
  }

  /* 상단 좌측 설명 */
  .shuspell-top-desc {
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 25px;
    letter-spacing: -0.5px;
  }

  /* 메인 타이틀 영역 */
  .shuspell-title-area {
    text-align: center;
    margin-bottom: 20px;
  }
  .shuspell-brand {
    font-size: 18px;
    font-weight: 700;
    color: #f0f0f0;
    text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
    margin-bottom: 2px;
  }
  .shuspell-product-name {
    font-size: 28px;
    font-weight: 900;
    color: #ffffff;
    text-shadow: 1px 1px 4px rgba(0,0,0,0.4);
    letter-spacing: 1px;
    margin-bottom: 8px;
  }
  .shuspell-notice {
    font-size: 15px;
    font-weight: 700;
  }

  /* 제품 이미지 플레이스홀더 (실제 SPA 적용 시 img 태그로 교체) */
  .shuspell-image-container {
    width: 100%;
    height: 400px; /* 실제 이미지 비율에 맞게 조정 필요 */
    background: url('img/detail7300_0_v7300.png') no-repeat center center;
    background-size: contain;
    margin-bottom: 20px;
  }

  /* 하단 특징 4구역 그리드 */
  .shuspell-features-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px; /* 간격 최소화 */
    margin-bottom: 30px;
  }
  .shuspell-feature-item {
    background-color: rgba(50, 50, 50, 0.7);
    color: #fff;
    padding: 10px 12px;
    font-size: 12px;
    font-weight: 500;
    text-align: center;
    border-radius: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* 하단 푸터 로고 텍스트 */
  .shuspell-footer {
    text-align: center;
    font-size: 10px;
    color: #555;
    font-weight: 500;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>

<div class="shuspell-detail-wrapper">
  
  <!-- 상단 설명 -->
  <div class="shuspell-top-desc">
    <p>キズやホコリを気にせず</p>
    <p>サッと簡単収納〜</p>
    <p>軽量メッシュ素材のポーチ</p>
  </div>

  <!-- 메인 타이틀 -->
  <div class="shuspell-title-area">
    <p class="shuspell-brand">(SHUSPELL)シュスペル</p>
    <h1 class="shuspell-product-name">エアセラピー ポーチ</h1>
    <p class="shuspell-notice">“ 本製品はシュスペル エアセラピー専用ポーチです ”</p>
  </div>

  <!-- 제품 이미지 영역 (실제 프로젝트에서는 src 경로를 맞춰주세요) -->
  <div class="shuspell-image-container">
    <!-- <img src="V_7300(1).jpg" alt="SHUSPELL Air Therapy Pouch" style="width:100%; height:auto;"> -->
  </div>

  <!-- 특징 그리드 -->
  <div class="shuspell-features-grid">
    <div class="shuspell-feature-item">本体を保護し<br>ホコリをしっかりガード</div>
    <div class="shuspell-feature-item">通気性に優れた<br>軽量メッシュ素材を採用</div>
    <div class="shuspell-feature-item">収納時も安心の<br>優れた安定感</div>
    <div class="shuspell-feature-item">シックなブラックに<br>映えるホワイトロゴ</div>
  </div>

  <!-- 하단 텍스트 -->
  <div class="shuspell-footer">
    SHUSPELL Air Therapy Pouch
  </div>

</div>

</body>
</html>
