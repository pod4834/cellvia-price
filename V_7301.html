    <script src="https://cdn.tailwindcss.com"></script>
    <script>

            theme: {

                    fontFamily: {
                        sans: ['"Noto Sans JP"', 'sans-serif'],

                    colors: {
                        brand: {
                            light: '#e0c3cc', /* Text color from the image */

                    }

    <style>
        /* Custom styles to simulate the background vibe and tight spacing */
        body {
            /* Simulating the abstract background from the image */
            background: linear-gradient(135deg, #1a202c 0%, #2d3748 50%, #1a1a1a 100%);
            color: #ffffff;
            /* Tightening global line-height to minimize spacing as requested */
            line-height: 1.2;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Abstract background waves simulation if the image doesn't cover everything perfectly */
        .bg-waves {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: 
                radial-gradient(circle at 15% 50%, rgba(79, 209, 197, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(237, 137, 54, 0.05) 0%, transparent 50%);
            overflow: hidden;
            pointer-events: none;
        }

        /* Further tightening for specific utility classes */
        .tight-spacing {
            margin-top: 0 !important;
            margin-bottom: 0 !important;
            padding-top: 0 !important;
            padding-bottom: 0 !important;
        }
        
        .section-gap {
            /* Minimal gap between major sections */
            margin-top: 1rem;
            margin-bottom: 1rem;
        }

        .highlight-text {
            /* Simulating the iridescent text color */
            background: linear-gradient(to right, #f6e05e, #f687b3, #4fd1c5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
    </style>
</head>
